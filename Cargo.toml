[package]
name = "agent-profile"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
description = "Spawn-time role-profile resolver for coding-agent runtimes"
license = "MIT"

[[bin]]
name = "agent-profile"
path = "src/main.rs"

[lib]
name = "agent_profile"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "2"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
