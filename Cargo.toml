[package]
name = "agent-profile"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
description = "Spawn-time role-profile resolver for coding-agent runtimes"
license = "MIT"

[[bin]]
name = "agent-profile"
path = "src/main.rs"

[lib]
name = "agent_profile"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
# preserve_order keeps foreign keys in merged JSON files (.mcp.json,
# settings.local.json) in their original positions — surgical diffs.
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml = "0.9"
sha2 = "0.10"
similar = "3.1.1"
tempfile = "3"
thiserror = "2"
toml_edit = "0.25.12"
which = "7"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
